# Render Blueprint: the Leash web app and its Postgres database.
#
# Judging runs Dec 1-15, 2026. Keep both on paid plans until then: free web services sleep
# when idle and free Postgres databases expire.
services:
  - type: web
    name: leash
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_MERCHANT_FRESHCART_EMAIL
        sync: false
      - key: DEMO_MERCHANT_ORBITTOYS_EMAIL
        sync: false
      - key: DEMO_PERSON_ARJUN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AG_STUDIO
        sync: false

databases:
  - name: leash-db
    databaseName: leash
    user: leash
    plan: 0.1c-256mb
